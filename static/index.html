<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHUNKYR // VIDEO INFILTRATION PROTOCOL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>" />
  <link rel="stylesheet" href="/static/breach-protocol.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #08080e;
      --surface:    #0e0e16;
      --surface2:   #13131e;
      --border:     #1f1f2e;
      --border2:    #2a2a3e;
      --text:       #c8c8d0;
      --text-dim:   #6a6a80;
      --yellow:     #fcee0a;
      --cyan:       #00f0ff;
      --magenta:    #ff2a6d;
      --green:      #39ff14;
      --amber:      #ff9d00;
      --transition: .18s ease;
    }

    /* ── Base ── */
    body {
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2.5rem 1rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Ambient glow blobs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.25);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Night City Photo Background ── */
    #night-city {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: url('/static/nightcity_1920.jpg') center top / cover no-repeat;
    }

    #night-city::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 12, 0.45);
      z-index: 1;
    }

    .nc-base, .nc-ca-r, .nc-ca-c {
      position: absolute;
      inset: 0;
      background: url('/static/nightcity_1920.jpg') center top / cover no-repeat;
    }
    .nc-ca-r {
      transform: translate(4px, -3px);
      mix-blend-mode: screen;
      opacity: 0.38;
      animation: ca-shift 7s ease-in-out infinite alternate;
    }
    .nc-ca-c {
      transform: translate(-4px, 3px);
      mix-blend-mode: screen;
      opacity: 0.32;
      animation: ca-shift 7s ease-in-out infinite alternate-reverse;
    }

    @keyframes ca-shift {
      from { transform: translate(-4px, -3px) scale(1.0); }
      to   { transform: translate(4px, 3px) scale(1.003); }
    }

    /* Glitch bands */
    .nc-glitch { position: absolute; inset: 0; overflow: hidden; }
    .nc-g1, .nc-g2, .nc-g3, .nc-g4 {
      position: absolute; left: 0; right: 0;
      background: url('/static/nightcity_1920.jpg') center top / cover no-repeat;
      animation: glitch-anim 4s steps(1) infinite;
    }
    .nc-g1 { top: 12%; height: 7%;  animation-duration: 3.8s; animation-delay: 0.0s; }
    .nc-g2 { top: 34%; height: 5%;  animation-duration: 5.1s; animation-delay: 0.7s; }
    .nc-g3 { top: 58%; height: 8%;  animation-duration: 4.4s; animation-delay: 1.3s; }
    .nc-g4 { top: 78%; height: 4%;  animation-duration: 6.2s; animation-delay: 2.1s; }

    @keyframes glitch-anim {
      0%,  84% { transform: translateX(0);       opacity: 0; }
      85%       { transform: translateX(-12px);  opacity: 0.9; }
      87%       { transform: translateX(8px);   opacity: 0.9; }
      89%       { transform: translateX(-5px);  opacity: 0.7; }
      91%       { transform: translateX(0);      opacity: 0; }
      92%, 100% { transform: translateX(0);      opacity: 0; }
    }

    /* CRT scanlines */
    .nc-scanlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px);
      z-index: 3;
      animation: scanline-drift 0.08s steps(1) infinite;
    }
    @keyframes scanline-drift {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(4px); }
      100% { transform: translateY(0px); }
    }

    /* Noise */
    .nc-noise {
      position: absolute; inset: 0; z-index: 4; opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      animation: noise-shift 0.12s steps(1) infinite;
    }
    @keyframes noise-shift {
      0%   { background-position: 0    0;    }
      20%  { background-position: -40px  80px; }
      40%  { background-position:  60px -30px; }
      60%  { background-position: -80px  40px; }
      80%  { background-position:  30px  90px; }
      100% { background-position:   0    0;   }
    }

    .nc-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 100% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
      z-index: 5;
    }

    /* ── Header ── */
    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      font-family: 'Orbitron', monospace;
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(252,238,10,.5), 0 0 60px rgba(252,238,10,.2);
      margin-bottom: .6rem;
      letter-spacing: .05em;
      animation: glitch 4s infinite;
    }
    @keyframes glitch {
      0%, 92%, 100% { transform: translate(0, 0); text-shadow: 0 0 20px rgba(252,238,10,.5), 0 0 60px rgba(252,238,10,.2); }
      93% { transform: translate(-2px, 1px); text-shadow: 2px 0 var(--magenta), -2px 0 var(--cyan); }
      94% { transform: translate(1px, -1px); text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan); }
      95% { transform: translate(0, 0); }
    }

    .logo svg { width: 40px; height: 40px; flex-shrink: 0; }

    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: .8rem;
      color: var(--text-dim);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: .4rem;
    }

    .hero p {
      color: var(--text-dim);
      font-size: .95rem;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Main card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border2);
      width: 100%;
      max-width: 620px;
      position: relative;
      z-index: 1;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      box-shadow: 0 0 0 1px rgba(252,238,10,.08), 0 0 40px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.3);
    }

    .card-inner { padding: 2rem 2rem 2rem; }

    .card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      border-top: 2px solid var(--yellow);
      border-right: 2px solid var(--yellow);
      width: 24px; height: 24px;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      border-bottom: 2px solid var(--cyan);
      border-left: 2px solid var(--cyan);
      width: 24px; height: 24px;
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    /* ── Section label ── */
    .section-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .65rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--yellow);
      margin-bottom: .8rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .section-label::before { content: '//'; color: var(--text-dim); font-size: .7rem; }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border2), transparent);
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      gap: .5rem;
      margin-bottom: 1rem;
    }

    .url-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border2);
      padding: .75rem 1rem;
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: .88rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }
    .url-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(0,240,255,.2), inset 0 0 20px rgba(0,240,255,.03);
    }
    .url-input::placeholder { color: var(--text-dim); opacity: .6; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .75rem 1.4rem;
      font-family: 'Orbitron', monospace;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      border: none;
    }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--yellow);
      color: #000;
    }
    .btn-primary:hover {
      background: #ffe81a;
      box-shadow: 0 0 20px rgba(252,238,10,.4), 0 0 40px rgba(252,238,10,.15);
    }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent;
      color: var(--magenta);
      border: 1px solid var(--magenta);
    }
    .btn-ghost:hover {
      background: rgba(255,42,109,.1);
      box-shadow: 0 0 15px rgba(255,42,109,.3);
    }

    /* ── Format selector ── */
    .format-section {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      animation: fadein .3s ease;
    }
    .format-section.visible { display: block; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Video meta ── */
    .video-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
      align-items: flex-start;
    }

    .video-meta img {
      width: 130px;
      height: 74px;
      object-fit: cover;
      border: 1px solid var(--border2);
      flex-shrink: 0;
      filter: saturate(0.7) brightness(0.85);
    }

    .video-meta .info { flex: 1; min-width: 0; }

    .video-meta .info h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: .4rem;
    }

    .video-meta .info p {
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      color: var(--text-dim);
    }

    /* ── Site badge ── */
    .site-badge {
      display: inline-block;
      font-family: 'Share Tech Mono', monospace;
      font-size: .62rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--amber);
      background: rgba(255,157,0,.1);
      border: 1px solid rgba(255,157,0,.25);
      padding: .2rem .6rem;
      margin-bottom: .8rem;
      clip-path: polygon(4px 0, 100% 0, 100% 100%, 0 100%, 0 4px);
    }

    /* ── Format grid ── */
    .format-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: .4rem;
      margin-bottom: 1.2rem;
    }

    .format-btn {
      background: var(--bg);
      border: 1px solid var(--border2);
      padding: .6rem .7rem;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem;
      cursor: pointer;
      text-align: left;
      transition: all var(--transition);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }
    .format-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0,240,255,.05);
      box-shadow: 0 0 10px rgba(0,240,255,.1);
    }
    .format-btn.selected {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(252,238,10,.06);
      box-shadow: 0 0 12px rgba(252,238,10,.15);
    }
    .format-btn .size {
      color: var(--text-dim);
      font-size: .68rem;
      margin-top: .15rem;
    }

    /* ── Download row ── */
    .download-row {
      display: flex;
      gap: .5rem;
      justify-content: flex-end;
    }

    /* ── Status ── */
    .status {
      margin-top: 1rem;
      padding: .7rem 1rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: .78rem;
      display: none;
      align-items: flex-start;
      gap: .6rem;
      line-height: 1.4;
    }
    .status.error   { display: flex; background: rgba(255,42,109,.08); color: var(--magenta); border: 1px solid rgba(255,42,109,.25); }
    .status.success { display: flex; background: rgba(57,255,20,.06); color: var(--green); border: 1px solid rgba(57,255,20,.2); }
    .status.loading { display: flex; background: rgba(0,240,255,.05); color: var(--cyan); border: 1px solid rgba(0,240,255,.2); }

    .status svg { flex-shrink: 0; margin-top: 1px; }

    /* ── Spinner ── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(0,240,255,.2);
      border-top-color: var(--cyan);
      border-right-color: rgba(0,240,255,.5);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Progress ── */
    .progress-wrap {
      display: none;
      margin-top: 1rem;
    }
    .progress-wrap.visible { display: block; }

    .progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .72rem;
      color: var(--text-dim);
      margin-bottom: .4rem;
      display: flex;
      justify-content: space-between;
    }

    .progress-bar {
      height: 3px;
      background: var(--border2);
      overflow: hidden;
      position: relative;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,.3) 4px, rgba(0,0,0,.3) 8px);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--yellow), var(--cyan));
      transition: width .4s ease;
      width: 0%;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: -1px; bottom: -1px;
      width: 6px;
      background: #fff;
      opacity: .8;
      box-shadow: 0 0 8px rgba(255,255,255,.6);
    }

    /* ── Footer ── */
    footer {
      margin-top: 2rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: .65rem;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: .1em;
      position: relative;
      z-index: 1;
    }
    footer a { color: var(--cyan); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Glitch line ── */
    .glitch-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(252,238,10,.3) 20%, rgba(0,240,255,.3) 50%, rgba(255,42,109,.3) 80%, transparent 100%);
      margin: 1.5rem 0;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); }
    ::-webkit-scrollbar-thumb:hover { background: var(--yellow); }
  </style>
</head>

<script>
// ── CHUNKYR // Frontend ───────────────────────────────────────────────────────

const urlInput       = document.getElementById('urlInput');
const fetchBtn       = document.getElementById('fetchBtn');
const formatSection  = document.getElementById('formatSection');
const formatGrid     = document.getElementById('formatGrid');
const videoMeta      = document.getElementById('videoMeta');
const siteBadge      = document.getElementById('siteBadge');
const downloadBtn    = document.getElementById('downloadBtn');
const cancelBtn      = document.getElementById('cancelBtn');
const statusBox      = document.getElementById('statusBox');
const progressWrap   = document.getElementById('progressWrap');
const progressFill   = document.getElementById('progressFill');
const progressPct   = document.getElementById('progressPct');
const progressText   = document.getElementById('progressText');

let selectedFormat = null;
let videoInfo      = null;
let abortController = null;
let bpInstance     = null;

// ── Helpers ─────────────────────────────────────────────────────────────────

function showStatus(msg, type = 'error') {
  const icons = {
    error:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
    success: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
    loading: '',
  };
  statusBox.innerHTML = `${icons[type] || ''} ${msg}`;
  statusBox.className = `status ${type}`;
}

function hideStatus() {
  statusBox.className = 'status';
  statusBox.style.display = 'none';
}

function formatDuration(s) {
  if (!s) return '';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1e6) return `${(bytes/1e3).toFixed(0)} KB`;
  if (bytes < 1e9) return `${(bytes/1e6).toFixed(1)} MB`;
  return `${(bytes/1e9).toFixed(2)} GB`;
}

// ── Fetch video info ────────────────────────────────────────────────────────

function resetFetchButton() {
  fetchBtn.disabled = false;
  fetchBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> JACK IN`;
}

document.getElementById('urlForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = urlInput.value.trim();
  if (!url) return;

  hideStatus();
  formatSection.classList.remove('visible');
  fetchBtn.disabled = true;
  fetchBtn.innerHTML = `<span class="spinner"></span> SCANNING…`;

  try {
    const res  = await fetch('/api/info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();

    if (!res.ok) {
      showStatus(data.error || '> SCAN FAILED. INVALID SIGNAL.');
      return;
    }

    videoInfo = data;
    renderFormats(data);
  } catch (err) {
    showStatus('> NETWORK FAILURE. CHECK SERVER CONNECTION.');
  } finally {
    resetFetchButton();
  }
});

function renderFormats(info) {
  videoMeta.innerHTML = info.thumbnail
    ? `<img src="${info.thumbnail}" alt="Thumbnail" loading="lazy" />`
    : '';
  videoMeta.querySelector('img') || videoMeta.classList.add('no-thumb');

  const infoDiv = videoMeta.querySelector('.info') || (() => {
    const d = document.createElement('div');
    d.className = 'info';
    videoMeta.appendChild(d);
    return d;
  })();
  infoDiv.innerHTML = `<h2>${info.title || 'Untitled'}</h2>
    <p>${info.uploader ? `by ${info.uploader}  •  ` : ''}
    ${formatDuration(info.duration) || ''}</p>`;

  siteBadge.textContent = info.site;

  formatGrid.innerHTML = '';
  selectedFormat = null;

  const sorted = [...info.formats].sort((a, b) => {
    const pa = parseInt(a.label) || 0;
    const pb = parseInt(b.label) || 0;
    return pb - pa;
  });

  sorted.forEach((fmt, i) => {
    const btn = document.createElement('button');
    btn.className = 'format-btn' + (i === 0 ? ' selected' : '');
    const isVideo = /\d+p/.test(fmt.label);
    const audioNote = (isVideo && !fmt.is_combined) ? ' <span style="color:var(--amber)">+audio</span>' : '';
    btn.innerHTML = `${fmt.label}${audioNote}${fmt.filesize ? `<br><span class="size">${formatSize(fmt.filesize)}</span>` : ''}`;
    btn.dataset.formatId = fmt.format_id;

    if (i === 0) selectedFormat = { format_id: fmt.format_id, is_combined: fmt.is_combined };

    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedFormat = { format_id: fmt.format_id, is_combined: fmt.is_combined };
    });

    formatGrid.appendChild(btn);
  });

  formatSection.classList.add('visible');
}

// ── Breach Protocol + Download ──────────────────────────────────────────────

downloadBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (!url) return;

  // Launch Breach Protocol. Only proceed to download on success.
  bpInstance = new BreachProtocol({
    onSuccess: () => {
      bpInstance = null;
      doDownload(url);
    },
    onFail: () => {
      bpInstance = null;
      showStatus('> BREACH PROTOCOL FAILED. ACCESS DENIED.', 'error');
      downloadBtn.disabled = false;
      downloadBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> EXECUTE`;
    },
  });
  bpInstance.start();

  // Show loading state on the button while minigame runs
  downloadBtn.disabled = true;
  downloadBtn.innerHTML = `<span class="spinner"></span> BREACHING…`;
});

async function doDownload(url) {
  downloadBtn.disabled = true;
  downloadBtn.innerHTML = `<span class="spinner"></span> EXECUTING…`;
  progressWrap.classList.add('visible');

  abortController = new AbortController();

  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, ...selectedFormat }),
      signal: abortController.signal,
    });

    if (!res.ok) {
      const data = await res.json();
      showStatus(data.error || '> EXTRACTION FAILED.');
      return;
    }

    const blob = await res.blob();
    const contentDisp = res.headers.get('Content-Disposition') || '';
    const filenameMatch = contentDisp.match(/filename\*?=['"]?(?:UTF-8'')?([^;\n"']+)/i)
                       || [null, `${videoInfo?.title || 'video'}.mp4`];
    const filename = decodeURIComponent(filenameMatch[1]);

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);

    showStatus('> FILE SAVED TO LOCAL STORAGE. CHECK DOWNLOADS.', 'success');

  } catch (err) {
    if (err.name !== 'AbortError') {
      showStatus('> EXTRACTION ERROR: ' + err.message);
    }
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> EXECUTE`;
    progressWrap.classList.remove('visible');
  }
}

cancelBtn.addEventListener('click', () => {
  if (bpInstance) { bpInstance.destroy(); bpInstance = null; }
  if (abortController) abortController.abort();
  formatSection.classList.remove('visible');
  selectedFormat = null;
  videoInfo = null;
  hideStatus();
  progressWrap.classList.remove('visible');
  downloadBtn.disabled = false;
  downloadBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> EXECUTE`;
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('urlForm').dispatchEvent(new Event('submit'));
  }
});
</script>
