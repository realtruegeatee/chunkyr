<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Glow filter: blur + composite -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080000"/>
      <stop offset="60%" stop-color="#120000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000"/>
      <stop offset="35%" stop-color="#ee1111"/>
      <stop offset="65%" stop-color="#ff2222"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <!-- Scanlines -->
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#000000" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Sky background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <!-- Spotlight glow from top -->
  <rect width="1920" height="1080" fill="url(#spotlight)"/>
  <!-- Grid overlay -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- City silhouette — buildings against red sky -->
  <g fill="#050000">
    <!-- Far background buildings (slightly lighter) -->
    <g opacity="0.6">
      <rect x="0" y="600" width="80" height="480"/>
      <rect x="70" y="560" width="60" height="520"/>
      <rect x="120" y="620" width="90" height="460"/>
      <rect x="200" y="500" width="70" height="580"/>
      <rect x="260" y="540" width="110" height="540"/>
      <rect x="360" y="580" width="80" height="500"/>
      <rect x="430" y="520" width="100" height="560"/>
      <rect x="520" y="560" width="60" height="520"/>
      <rect x="570" y="490" width="130" height="590"/>
      <rect x="690" y="550" width="90" height="530"/>
      <rect x="770" y="510" width="120" height="570"/>
      <rect x="880" y="570" width="70" height="510"/>
      <rect x="940" y="500" width="150" height="580"/>
      <rect x="1080" y="540" width="100" height="540"/>
      <rect x="1170" y="580" width="80" height="500"/>
      <rect x="1240" y="510" width="110" height="570"/>
      <rect x="1340" y="560" width="90" height="520"/>
      <rect x="1420" y="490" width="130" height="590"/>
      <rect x="1540" y="550" width="80" height="530"/>
      <rect x="1610" y="520" width="100" height="560"/>
      <rect x="1700" y="570" width="90" height="510"/>
      <rect x="1780" y="500" width="140" height="580"/>
    </g>
    <!-- Building windows (dim red lights) -->
    <g fill="#ff0000" opacity="0.15">
      <rect x="75" y="570" width="4" height="3"/><rect x="90" y="590" width="4" height="3"/>
      <rect x="205" y="510" width="4" height="3"/><rect x="220" y="535" width="4" height="3"/>
      <rect x="280" y="550" width="4" height="3"/><rect x="310" y="580" width="4" height="3"/>
      <rect x="440" y="530" width="4" height="3"/><rect x="470" y="555" width="4" height="3"/>
      <rect x="580" y="500" width="4" height="3"/><rect x="610" y="530" width="4" height="3"/>
      <rect x="700" y="560" width="4" height="3"/><rect x="730" y="590" width="4" height="3"/>
      <rect x="780" y="520" width="4" height="3"/><rect x="820" y="550" width="4" height="3"/>
      <rect x="950" y="510" width="4" height="3"/><rect x="1000" y="545" width="4" height="3"/>
      <rect x="1090" y="550" width="4" height="3"/><rect x="1125" y="575" width="4" height="3"/>
      <rect x="1250" y="520" width="4" height="3"/><rect x="1290" y="555" width="4" height="3"/>
      <rect x="1350" y="570" width="4" height="3"/><rect x="1385" y="600" width="4" height="3"/>
      <rect x="1430" y="500" width="4" height="3"/><rect x="1480" y="535" width="4" height="3"/>
      <rect x="1550" y="560" width="4" height="3"/><rect x="1585" y="590" width="4" height="3"/>
      <rect x="1620" y="530" width="4" height="3"/><rect x="1660" y="560" width="4" height="3"/>
      <rect x="1790" y="510" width="4" height="3"/><rect x="1830" y="545" width="4" height="3"/>
    </g>
  </g>

  <!-- Red ground/horizon glow -->
  <rect x="0" y="720" width="1920" height="360" fill="url(#groundGrad)"/>
  <rect x="0" y="710" width="1920" height="30" fill="#ff0000" opacity="0.06"/>
  <rect x="0" y="720" width="1920" height="8" fill="#ff0000" opacity="0.12"/>

  <!-- ── MILITECH logo section ── -->

  <!-- Outer frame glow layer -->
  <rect x="400" y="240" width="1120" height="320" rx="4" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.3" filter="url(#glow)"/>

  <!-- Main frame -->
  <rect x="460" y="280" width="1000" height="240" rx="2" fill="#0a0000" stroke="url(#logoGrad)" stroke-width="2"/>

  <!-- Inner frame line -->
  <rect x="468" y="288" width="984" height="224" rx="1" fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.5"/>

  <!-- Top horizontal rule -->
  <rect x="500" y="310" width="920" height="1" fill="#ff0000" opacity="0.4"/>

  <!-- MILITECH text -->
  <text x="960" y="390" text-anchor="middle"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="135" font-weight="900"
        fill="url(#logoGrad)"
        letter-spacing="18"
        filter="url(#glow)">MILITECH</text>

  <!-- Bottom horizontal rule -->
  <rect x="500" y="415" width="920" height="1" fill="#ff0000" opacity="0.4"/>

  <!-- Tagline -->
  <text x="960" y="455" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-size="22" font-weight="900"
        fill="url(#tagGrad)"
        letter-spacing="10"
        filter="url(#glow2)">ARMED  ·  PROFESSIONAL  ·  LETHAL</text>

  <!-- Corner bracket accents -->
  <g stroke="#ff0000" stroke-width="2.5" fill="none" filter="url(#glow3)">
    <!-- Top left -->
    <path d="M 460,295 L 460,280 L 485,280"/>
    <!-- Top right -->
    <path d="M 1460,295 L 1460,280 L 1435,280"/>
    <!-- Bottom left -->
    <path d="M 460,505 L 460,520 L 485,520"/>
    <!-- Bottom right -->
    <path d="M 1460,505 L 1460,520 L 1435,520"/>
  </g>

  <!-- ── Status panels ── -->

  <!-- Left panel: THREAT LEVEL -->
  <rect x="50" y="280" width="220" height="120" fill="#0a0000" stroke="#ff0000" stroke-width="1.5" filter="url(#glow2)"/>
  <rect x="55" y="285" width="210" height="110" fill="none" stroke="#ff0000" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="315" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4444" letter-spacing="3">THREAT LEVEL</text>
  <text x="160" y="360" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="56" font-weight="900" fill="#ff0000" filter="url(#glow2)">MAX</text>
  <!-- Progress bar -->
  <rect x="70" y="375" width="180" height="6" fill="#220000"/>
  <rect x="70" y="375" width="180" height="6" fill="#ff0000" filter="url(#glow3)"/>
  <text x="70" y="392" font-family="monospace" font-size="8" fill="#ff0000" opacity="0.6" letter-spacing="1">■■■■■■■■■■</text>

  <!-- Right panel: AUTHORIZATION -->
  <rect x="1650" y="280" width="220" height="120" fill="#0a0000" stroke="#ff6600" stroke-width="1.5" filter="url(#glow2)"/>
  <rect x="1655" y="285" width="210" height="110" fill="none" stroke="#ff6600" stroke-width="0.5" opacity="0.4"/>
  <text x="1760" y="315" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6600" letter-spacing="3">AUTHORIZATION</text>
  <text x="1760" y="360" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#ff6600" filter="url(#glow2)">CLEARED</text>
  <!-- Status bar -->
  <rect x="1670" y="375" width="180" height="6" fill="#221100"/>
  <rect x="1670" y="375" width="180" height="6" fill="#ff6600" filter="url(#glow3)"/>

  <!-- ── Tactical data sidebar ── -->

  <!-- Left side data -->
  <g font-family="monospace" font-size="10" fill="#ff0000" opacity="0.55" letter-spacing="1">
    <text x="50" y="440">SYS.MILITECH.v4.077</text>
    <text x="50" y="455">CLASS: OMEGA</text>
    <text x="50" y="470">PRIORITY: ALPHA</text>
    <text x="50" y="485">STATUS: ACTIVE</text>
    <text x="50" y="500">// NOMAD THREAT DETECTED</text>
  </g>

  <!-- Right side data -->
  <g font-family="monospace" font-size="10" fill="#ff6600" opacity="0.55" text-anchor="end" letter-spacing="1">
    <text x="1870" y="440">CONTRACT: 7741-MT</text>
    <text x="1870" y="455">DIV: ARMED FORCES</text>
    <text x="1870" y="470">AUTH: GRANTED</text>
    <text x="1870" y="485">OVERRIDE: ENABLED</text>
    <text x="1870" y="500">// ELITE CONTRACTOR DIV</text>
  </g>

  <!-- ── Barcode / serial strip ── -->
  <g transform="translate(580, 580)">
    <g fill="#ff0000">
      <rect x="0" y="0" width="4" height="28"/><rect x="8" y="0" width="2" height="28"/>
      <rect x="14" y="0" width="5" height="28"/><rect x="23" y="0" width="1" height="28"/>
      <rect x="28" y="0" width="3" height="28"/><rect x="35" y="0" width="6" height="28"/>
      <rect x="45" y="0" width="2" height="28"/><rect x="51" y="0" width="4" height="28"/>
      <rect x="59" y="0" width="1" height="28"/><rect x="64" y="0" width="5" height="28"/>
      <rect x="73" y="0" width="2" height="28"/><rect x="79" y="0" width="3" height="28"/>
      <rect x="86" y="0" width="6" height="28"/><rect x="96" y="0" width="1" height="28"/>
      <rect x="101" y="0" width="4" height="28"/><rect x="109" y="0" width="2" height="28"/>
      <rect x="115" y="0" width="5" height="28"/><rect x="124" y="0" width="1" height="28"/>
      <rect x="129" y="0" width="3" height="28"/><rect x="136" y="0" width="6" height="28"/>
      <rect x="146" y="0" width="2" height="28"/><rect x="152" y="0" width="4" height="28"/>
      <rect x="160" y="0" width="1" height="28"/><rect x="165" y="0" width="5" height="28"/>
      <rect x="174" y="0" width="2" height="28"/><rect x="180" y="0" width="3" height="28"/>
      <rect x="187" y="0" width="6" height="28"/><rect x="197" y="0" width="1" height="28"/>
      <rect x="202" y="0" width="4" height="28"/><rect x="210" y="0" width="2" height="28"/>
      <rect x="216" y="0" width="5" height="28"/><rect x="225" y="0" width="1" height="28"/>
      <rect x="230" y="0" width="3" height="28"/><rect x="237" y="0" width="6" height="28"/>
      <rect x="247" y="0" width="2" height="28"/><rect x="253" y="0" width="4" height="28"/>
      <rect x="261" y="0" width="1" height="28"/><rect x="266" y="0" width="5" height="28"/>
      <rect x="275" y="0" width="2" height="28"/><rect x="281" y="0" width="3" height="28"/>
      <rect x="288" y="0" width="6" height="28"/><rect x="298" y="0" width="1" height="28"/>
      <rect x="303" y="0" width="4" height="28"/><rect x="311" y="0" width="2" height="28"/>
      <rect x="317" y="0" width="5" height="28"/><rect x="326" y="0" width="1" height="28"/>
      <rect x="331" y="0" width="3" height="28"/><rect x="338" y="0" width="6" height="28"/>
      <rect x="348" y="0" width="2" height="28"/><rect x="354" y="0" width="4" height="28"/>
      <rect x="362" y="0" width="1" height="28"/><rect x="367" y="0" width="5" height="28"/>
      <rect x="376" y="0" width="2" height="28"/><rect x="382" y="0" width="3" height="28"/>
      <rect x="389" y="0" width="6" height="28"/><rect x="399" y="0" width="1" height="28"/>
      <rect x="404" y="0" width="4" height="28"/><rect x="412" y="0" width="2" height="28"/>
      <rect x="418" y="0" width="5" height="28"/><rect x="427" y="0" width="1" height="28"/>
      <rect x="432" y="0" width="3" height="28"/><rect x="439" y="0" width="6" height="28"/>
      <rect x="449" y="0" width="2" height="28"/><rect x="455" y="0" width="4" height="28"/>
      <rect x="463" y="0" width="1" height="28"/><rect x="468" y="0" width="5" height="28"/>
      <rect x="477" y="0" width="2" height="28"/><rect x="483" y="0" width="3" height="28"/>
      <rect x="490" y="0" width="6" height="28"/><rect x="500" y="0" width="1" height="28"/>
      <rect x="505" y="0" width="4" height="28"/><rect x="513" y="0" width="2" height="28"/>
      <rect x="519" y="0" width="5" height="28"/><rect x="528" y="0" width="1" height="28"/>
      <rect x="533" y="0" width="3" height="28"/><rect x="540" y="0" width="6" height="28"/>
      <rect x="550" y="0" width="2" height="28"/><rect x="556" y="0" width="4" height="28"/>
      <rect x="564" y="0" width="1" height="28"/><rect x="569" y="0" width="5" height="28"/>
      <rect x="578" y="0" width="2" height="28"/><rect x="584" y="0" width="3" height="28"/>
      <rect x="591" y="0" width="6" height="28"/><rect x="601" y="0" width="1" height="28"/>
      <rect x="606" y="0" width="4" height="28"/><rect x="614" y="0" width="2" height="28"/>
      <rect x="620" y="0" width="5" height="28"/><rect x="629" y="0" width="1" height="28"/>
      <rect x="634" y="0" width="3" height="28"/><rect x="641" y="0" width="6" height="28"/>
      <rect x="651" y="0" width="2" height="28"/><rect x="657" y="0" width="4" height="28"/>
      <rect x="665" y="0" width="1" height="28"/><rect x="670" y="0" width="5" height="28"/>
      <rect x="679" y="0" width="2" height="28"/><rect x="685" y="0" width="3" height="28"/>
      <rect x="692" y="0" width="6" height="28"/>
