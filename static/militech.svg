    <text x="760" y="24" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff0000" letter-spacing="6" opacity="0.6">MT-7741-ARMED-FORCE-DIV-6</text>
  </g>

  <!-- Targeting crosshair -->
  <g stroke="#ff0000" stroke-width="0.8" opacity="0.25">
    <line x1="960" y1="530" x2="960" y2="560"/>
    <line x1="940" y1="545" x2="980" y2="545"/>
    <circle cx="960" cy="545" r="18" fill="none" stroke-dasharray="3 3"/>
    <circle cx="960" cy="545" r="32" fill="none"/>
  </g>

  <!-- Bottom tactical readout -->
  <g font-family="monospace" font-size="9" fill="#ff0000" opacity="0.4" letter-spacing="1">
    <text x="50" y="650">■ TACTICAL OPS</text>
    <text x="200" y="650">■ WEAPONS DIV</text>
    <text x="350" y="650">■ ARMOR PLATE</text>
    <text x="490" y="650">■ SUPPORT UNIT</text>
    <text x="1850" y="650" text-anchor="end">CONTRACTOR ■</text>
    <text x="1700" y="650" text-anchor="end">MERCENARY ■</text>
    <text x="1550" y="650" text-anchor="end">GOV CONTRACT ■</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="660" width="1920" height="2" fill="#ff0000" opacity="0.2"/>

  <!-- Vignette overlay -->
  <rect width="1920" height="1080" fill="url(#groundGrad)" opacity="0.4"/>

  <!-- Scanlines -->
  <rect width="1920" height="1080" fill="url(#scanlines)" opacity="0.5"/>
